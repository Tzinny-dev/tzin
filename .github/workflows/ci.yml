name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Build (dist + declarations)
        run: npm run build
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Coverage gate (src ≥ 70%)
        run: npm run test:coverage
      - name: MCP stdio probe
        run: node scripts/mcp-client.mjs
      - name: Workers probe (miniflare)
        run: node scripts/workers-probe.mjs

  bun-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Boot demo and hit endpoints
        run: |
          bun examples/bun-demo.ts &
          sleep 2
          curl -fs http://localhost:4620/health | grep -q '"status":"ok"'
          curl -fs -X POST http://localhost:4620/echo \
            -H 'content-type: application/json' \
            -d '{"message":"ci","loud":true}' | grep -q '"echoed":"CI"'

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (needed by HTTP bench -> dist imports)
        run: npm run build
      - name: Router lookup bench
        run: npm run bench:lookup
      - name: In-process pipeline bench
        run: npm run bench:pipeline
      - name: HTTP throughput bench (1 round)
        run: ROUNDS=1 npm run bench:http
