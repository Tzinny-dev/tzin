name: Release

# Runs CI (build + tests) on every v* tag pushed by `node scripts/release.mjs`.
#
# Publishing is MANUAL and happens locally with the npm token in ~/.npmrc
# (no secret in the repo, no OTP needed — see `release.mjs` next steps).
#
# If you later want CI to publish, uncomment the `publish` job below and
# register a Trusted Publisher (OIDC) for both packages at
# npmjs.com → package Settings → Trusted Publisher:
#   organization: Tzinny-dev / repo: tzin / workflow: release.yml
# Note: npm Trusted Publishing requires npm ^11.5.1 and an .npmrc WITHOUT
# an _authToken line (actions/setup-node#1551 — strip it after setup-node).

on:
  push:
    tags:
      - 'v*'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

