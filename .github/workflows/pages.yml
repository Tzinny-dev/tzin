name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      custom_domain:
        description: 'Forzar dominio custom? (auto = según public/CNAME)'
        type: choice
        default: auto
        options: [auto, 'true', 'false']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs deps
        working-directory: docs-site
        run: npm ci

      - name: Build VitePress site
        working-directory: docs-site
        env:
          CUSTOM_DOMAIN: ${{ inputs.custom_domain == 'auto' && '' || inputs.custom_domain }}
          # Google Analytics 4: definir como repo variable (Settings → Variables → GA_ID, ej. G-XXXXXXXXXX).
          # Si no está definida, el sitio compila igual pero sin tracking.
          GA_ID: ${{ vars.GA_ID }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
