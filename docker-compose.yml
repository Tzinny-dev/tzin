services:
  app:
    # This compose file lives in YOUR app repo (copy it from the tzin docs).
    # `build: .` points at the app root, NOT at the tzin framework repo.
    build: .
    ports: ["3000:3000"]
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Multi-node: set REDIS_URL to wire src/bus.ts into the Redis bus.
      # Unset → standalone app, no deps.
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
